<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><title>FORGE — Personal Training</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/theme-metal.css"></head><body><div class="app"><header><b>FORGE</b><small>METAL EDITION</small></header><nav><button data-view="home">INÍCIO</button><button data-view="workouts">TREINOS</button><button data-view="evolution">EVOLUÇÃO</button></nav><main>
<section id="home" class="view"><p class="eyebrow">YOUR TRAINING. YOUR RULES.</p><h1>BUILD YOUR STRENGTH.<br><em>OWN YOUR EVOLUTION.</em></h1><h2>Painel de treino</h2><div class="stats"><article>SESSÕES<strong id="total">0</strong></article><article>ESTA SEMANA<strong id="week">0</strong></article></div><h2>Seus treinos</h2><div id="home-list"></div><h2>Últimas sessões</h2><div id="history"></div></section>
<section id="workouts" class="view hidden"><p class="eyebrow">YOUR PROGRAM</p><h1>Treinos<em>.</em></h1><button id="new">＋ NOVO TREINO</button><div id="workout-list"></div></section>
<section id="evolution" class="view hidden"><p class="eyebrow">TRACK YOUR PROGRESS</p><h1>Evolução<em>.</em></h1><form id="measure"><label>Data<input id="mdate" type="date" required></label><label>Peso (kg)<input id="weight" type="number" step=".1"></label><label>Gordura corporal (%)<input id="fat" type="number" step=".1"></label><button>SALVAR AVALIAÇÃO</button></form><div id="measure-list"></div></section>
<section id="session" class="view hidden"><p class="eyebrow">LIVE WORKOUT</p><h1 id="session-name">Treino</h1><p id="elapsed">00:00</p><div id="session-exercises"></div><button id="finish">FINALIZAR TREINO</button><button id="leave">SAIR E CONTINUAR DEPOIS</button></section></main></div>
<dialog id="edit"><form id="workout-form"><h2>Novo treino</h2><label>Nome<input id="wname" required></label><label>Descrição<input id="wdesc"></label><div id="rows"></div><div class="addrow"><input id="ename" placeholder="Exercício"><input id="esets" type="number" value="3" min="1"><input id="ereps" value="12"><button type="button" id="add">＋</button></div><button type="submit">SALVAR</button><button type="button" id="close">FECHAR</button></form></dialog>
<dialog id="detail"><h2 id="dname"></h2><p id="ddesc"></p><div id="dex"></div><button id="start">INICIAR TREINO</button><button id="dclose">FECHAR</button></dialog>
<dialog id="rest"><p>DESCANSO</p><strong id="clock">01:30</strong><p id="restname"></p><button id="less">−15s</button><button id="more">+15s</button><button id="skip">PULAR</button></dialog><div id="toast"></div><script src="js/app.js"></script></body></html>
